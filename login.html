<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080609">
<title>LOMBRA // SECURE ACCESS</title><link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#080609;--panel:#120d12;--red:#ed2344;--red2:#ff526b;--text:#f7f0f3;--muted:#a08e98;--line:rgba(255,255,255,.09);--green:#45e3a6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,rgba(158,10,39,.2),transparent 40%),linear-gradient(145deg,#080609,#10090e 60%,#080609);color:var(--text);font-family:Cairo,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:42px 42px}.card{position:relative;width:min(100%,450px);padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(18,13,18,.94);box-shadow:0 30px 100px #0008;backdrop-filter:blur(22px)}.brand{text-align:center;margin-bottom:25px}.logo{width:70px;height:70px;object-fit:contain;border-radius:19px;border:1px solid #ed234433;background:#1b0d14;padding:8px}.brand h1{font:800 24px Orbitron,sans-serif;letter-spacing:2px;margin:13px 0 5px}.brand h1 span{color:var(--red2)}.brand p{font-size:10px;letter-spacing:3px;color:var(--muted);margin:0}.switch{display:flex;gap:7px;padding:5px;background:#09070a;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}.switch button{flex:1;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:700 11px Cairo;cursor:pointer}.switch button.active{background:linear-gradient(120deg,#8c1029,#e92345);color:#fff}.field{margin:14px 0}.field label{display:block;color:#d8c8d0;font-size:11px;margin-bottom:7px}.field input{width:100%;padding:13px 14px;background:#09070a;color:#fff;border:1px solid #382631;border-radius:10px;outline:none;font:12px Cairo}.field input:focus{border-color:var(--red2);box-shadow:0 0 0 3px #ed234415}.btn{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;padding:13px;border:1px solid transparent;border-radius:10px;font:800 12px Cairo;cursor:pointer;margin-top:13px}.primary{background:linear-gradient(120deg,#94102b,#ed2344);color:#fff}.discord{background:#5865f2;color:white}.secondary{background:#1a1219;border-color:var(--line);color:#f7f0f3}.btn:disabled{opacity:.55;cursor:wait}.hint{font-size:10px;line-height:2;color:var(--muted);margin:13px 0}.message{display:none;padding:11px 12px;margin:13px 0;border-radius:10px;font-size:11px;line-height:1.9}.message.show{display:block}.message.error{color:#ff9aaa;background:#ed234411;border:1px solid #ed234433}.message.ok{color:var(--green);background:#45e3a60c;border:1px solid #45e3a633}.divider{display:flex;align-items:center;gap:10px;color:#65535e;font-size:9px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}.hidden{display:none!important}.foot{text-align:center;font:9px Orbitron,sans-serif;color:#67535d;letter-spacing:2px;margin-top:24px}@media(max-width:480px){.card{padding:23px 18px}}
</style></head><body><main class="card">
<div class="brand"><img class="logo" src="logo.png" alt="LOMBRA" onerror="this.style.display='none'"><h1>LOM<span>BRA</span></h1><p>THE LEGENDS • SECURE ACCESS</p></div>
<div class="switch"><button id="adminTab" class="active" type="button">ADMIN DASHBOARD</button><button id="memberTab" type="button">DISCORD MEMBERS</button></div>
<div id="adminPanel"><form id="adminForm"><div class="field"><label for="username">USERNAME</label><input id="username" name="username" autocomplete="username" required maxlength="80" placeholder="اسم مستخدم الإدارة"></div><div class="field"><label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="كلمة مرور الإدارة"></div><button class="btn primary" id="adminSubmit" type="submit"><i class="fa-solid fa-shield-halved"></i> ENTER DASHBOARD</button></form><p class="hint">دخول Username وPassword مخصّص لحسابات BOSS / ADMIN فقط. حسابات الأعضاء تدخل عبر Discord.</p></div>
<div id="memberPanel" class="hidden"><p class="hint">سجّل الدخول بحساب Discord. إذا كانت هذه أول مرة لك، ستحتاج إلى كود دعوة من إدارة LOMBRA.</p><a class="btn discord" href="/auth/discord" style="text-decoration:none"><i class="fa-brands fa-discord"></i> CONTINUE WITH DISCORD</a><div id="invitePanel" class="hidden"><div class="divider">NEW MEMBER INVITATION</div><form id="inviteForm"><div class="field"><label for="inviteCode">INVITATION CODE</label><input id="inviteCode" name="code" autocomplete="off" maxlength="40" placeholder="LOMBRA-XXXXXXXXXXXX" required dir="ltr"></div><button class="btn primary" id="inviteSubmit" type="submit"><i class="fa-solid fa-ticket"></i> VERIFY INVITATION</button></form></div></div>
<div id="message" class="message" role="status" aria-live="polite"></div><div class="foot">LOMBRA INTERNAL NETWORK</div></main>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);
function showMessage(text,kind='error'){const el=$('message');el.textContent=text;el.className='message show '+kind}
function setTab(which){const admin=which==='admin';$('adminPanel').classList.toggle('hidden',!admin);$('memberPanel').classList.toggle('hidden',admin);$('adminTab').classList.toggle('active',admin);$('memberTab').classList.toggle('active',!admin);$('message').className='message';}
$('adminTab').addEventListener('click',()=>setTab('admin'));$('memberTab').addEventListener('click',()=>setTab('member'));
if(params.has('needsInvite')){setTab('member');$('invitePanel').classList.remove('hidden');showMessage('تم تسجيل Discord. أدخل كود الدعوة الذي أعطتك الإدارة.','ok')}
if(params.get('disabled')==='1')showMessage('هذا الحساب معطّل. تواصل مع الإدارة.');
if(params.has('discord')){const errs={inactive:'هذا الحساب غير نشط.',session_error:'تعذّر حفظ جلسة الدخول. حاول مجددًا.',cancelled:'ألغيت عملية Discord.',oauth_error:'فشل تسجيل الدخول عبر Discord. حاول مجددًا.',profile_error:'تعذّر قراءة ملف Discord.'};showMessage(errs[params.get('discord')]||'تعذّر تسجيل الدخول عبر Discord.');}
$('adminForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('adminSubmit');btn.disabled=true;try{const response=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw new Error(data.message||'تعذّر تسجيل الدخول.');const role=String(data.account?.role||'').trim().toUpperCase();const destination=String(data.destination||'').trim();if(destination==='/dashboard.html'){location.href=destination;return;}if(['BOSS','ADMIN'].includes(role)&&!destination){location.href='/dashboard.html';return;}throw new Error('حساب الإدارة غير مخوّل لدخول Dashboard. تأكد أن رتبة الحساب في قاعدة البيانات هي BOSS أو ADMIN.');}catch(err){showMessage(err.message)}finally{btn.disabled=false}});
$('inviteForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('inviteSubmit');btn.disabled=true;try{const response=await fetch('/api/invitations/redeem',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('inviteCode').value.trim().toUpperCase()})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw new Error(data.message||'تعذّر التحقق من كود الدعوة.');showMessage(data.message||'تم قبول الدعوة.', 'ok');location.href=data.destination||'/member.html';}catch(err){showMessage(err.message)}finally{btn.disabled=false}});
</script></body></html>
